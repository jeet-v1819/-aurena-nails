[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"
  SECRETS_SCAN_OMIT_PATHS = ".next/**, .netlify/**"
  SECRETS_SCAN_OMIT_KEYS = "AUTH_SECRET, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET"
