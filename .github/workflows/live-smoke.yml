name: Live production smoke test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site URL to test"
        required: false
        default: "https://aurena-nails.netlify.app"

permissions:
  contents: read

jobs:
  smoke:
    name: Auth, session and page smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run live smoke test
        # SMOKE_ADMIN_* are optional repository secrets. When configured, the
        # smoke test also proves that the production administrator can sign in
        # and open the dashboard. No credentials are stored in the repository.
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
        run: node scripts/live-smoke.mjs
